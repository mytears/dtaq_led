<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>국방기술품질원 · LED 안내</title>
  <link rel="stylesheet" href="include/css/led.css">
  <script defer src="include/js/protocol.js"></script>
  <script defer src="include/js/led.js"></script>
</head>
<body>
  <template id="rolling-template">
    <section class="screen" aria-label="홍보 영상 및 이미지">
      <div class="media-player"></div>
    </section>
  </template>
  <template id="welcome-template">
    <section class="screen welcome-screen" aria-label="방문 환영">
      <div class="welcome-background" aria-hidden="true"></div>
      <div class="welcome-player"></div>
    </section>
  </template>
  <main id="led-stage" aria-label="국방기술품질원 LED 안내 화면">
    <section id="screen-rolling" class="screen" aria-label="홍보 영상 및 이미지" hidden></section>
    <section id="screen-employee-search" class="screen" aria-label="직원 정보 검색 대기" hidden>
      <div class="artboard employee-background">
        <div class="search-card"><div class="search-copy"><h1>직원 정보 검색</h1><p>성명 · 부서 · 담당업무로 검색합니다.</p></div><img src="images/0_img_1.png" alt=""></div>
      </div>
    </section>
    <section id="screen-weapon-search" class="screen" aria-label="주요 사업 검색 대기" hidden>
      <div class="artboard weapon-background">
        <div class="search-card"><div class="search-copy"><h1>주요 사업 검색</h1><p>무기체계를 검색하실 수 있습니다.</p></div><img src="images/0_img_2.png" alt=""></div>
      </div>
    </section>
    <section id="screen-employee" class="screen" aria-label="직원 정보" hidden>
      <div class="artboard employee-background">
        <article class="panel employee-profile">
          <div class="employee-photo"><img id="employee-photo" alt="" hidden></div>
          <table class="employee-table"><tbody>
            <tr><th scope="row">성명</th><td id="employee-name"></td></tr>
            <tr><th scope="row">사번</th><td id="employee-id"></td></tr>
            <tr><th scope="row">근무지</th><td id="employee-dept"></td></tr>
            <tr><th scope="row">직급</th><td id="employee-pos"></td></tr>
            <tr><th scope="row">담당업무</th><td id="employee-duties"></td></tr>
            <tr><th scope="row">이메일</th><td id="employee-email"></td></tr>
            <tr><th scope="row">연락처</th><td id="employee-phone"></td></tr>
          </tbody></table>
        </article>
        <article class="panel employee-career"><h2><img src="images/ico_career.svg" alt="">근무이력</h2><div id="career-viewport" class="auto-scroll"><ol id="employee-history"></ol></div></article>
      </div>
    </section>
    <section id="screen-weapon" class="screen" aria-label="무기 및 사업 정보" hidden>
      <div class="artboard weapon-background">
        <article class="panel weapon-card">
          <h1 id="weapon-name"></h1>
          <div id="weapon-branch" hidden></div>
          <div class="weapon-photo"><img id="weapon-image" alt="" hidden></div>
          <table class="weapon-table"><tbody>
            <tr><th scope="row" id="weapon-label-1">개발형태</th><td id="weapon-development"></td></tr>
            <tr><th scope="row" id="weapon-label-2">제조업체</th><td id="weapon-manufacturer"></td></tr>
            <tr><th scope="row">사업기간 / 양산</th><td id="weapon-period"></td></tr>
            <tr class="performance-row"><th scope="row">주요성능</th><td><div id="weapon-performance" class="auto-scroll"></div></td></tr>
            <tr class="description-row"><th scope="row">기타</th><td><div id="weapon-description" class="auto-scroll"></div></td></tr>
          </tbody></table>
        </article>
      </div>
    </section>
  </main>
  <!-- 디버그 UI 임시 비활성화
  <aside id="debug-panel" aria-label="LED 디버그">
    <header><strong><i></i> LED DEBUG</strong><button id="debug-collapse" type="button" aria-expanded="true" aria-controls="debug-body">접기</button></header>
    <div id="debug-body">
      <form id="employee-form"><label for="debug-employee">직원 ID</label><div class="debug-input-row"><input id="debug-employee" placeholder="예: 261010" list="employee-ids" autocomplete="off"><button type="submit">LED 보기</button></div></form>
      <form id="weapon-form"><label for="debug-weapon">무기 / 사업 ID</label><div class="debug-input-row"><input id="debug-weapon" placeholder="예: weapon-02" list="weapon-ids" autocomplete="off"><button type="submit">LED 보기</button></div></form>
      <p class="debug-hint">ID를 비우면 검색 대기화면을 표시합니다.</p>
      <div class="debug-actions"><button id="debug-rolling" type="button">롤링</button><button id="debug-fullscreen" type="button">전체화면</button></div>
      <dl><div><dt>화면</dt><dd id="debug-screen">초기화 중</dd></div><div><dt>수신</dt><dd id="debug-connection">대기</dd></div></dl>
      <p id="debug-status" role="status" aria-live="polite">데이터를 불러오고 있습니다.</p>
      <small>D 키: 디버그 숨기기 / 표시</small>
    </div>
  </aside>
  -->
  <datalist id="employee-ids"></datalist><datalist id="weapon-ids"></datalist>
</body>
</html>
